name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Detect build output directory
        run: |
          if [[ -f dist/index.html ]]; then
            echo "BUILD_DIR=dist" >> "$GITHUB_ENV"
          elif [[ -f .output/public/index.html ]]; then
            echo "BUILD_DIR=.output/public" >> "$GITHUB_ENV"
          elif [[ -f .output/client/index.html ]]; then
            echo "BUILD_DIR=.output/client" >> "$GITHUB_ENV"
          else
            echo "Could not find build output with index.html"
            find . -maxdepth 4 -name index.html | cat
            exit 1
          fi

      - name: Add SPA fallback for deep links
        run: cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
