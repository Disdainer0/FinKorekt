name: Deploy Vite to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Detect build output directory
        run: |
          if [[ -d dist ]]; then
            echo "BUILD_DIR=dist" >> "$GITHUB_ENV"
          elif [[ -d .output/public ]]; then
            echo "BUILD_DIR=.output/public" >> "$GITHUB_ENV"
          elif [[ -d .output/client ]]; then
            echo "BUILD_DIR=.output/client" >> "$GITHUB_ENV"
          else
            echo "Could not find known build output directory"
            find . -maxdepth 4 -type d \( -name dist -o -name .output -o -name .vinxi \) | cat
            exit 1
          fi

      - name: Prepare static entrypoints for Pages
        run: |
          if [[ -f "$BUILD_DIR/index.html" ]]; then
            true
          elif [[ -f "$BUILD_DIR/_shell.html" ]]; then
            cp "$BUILD_DIR/_shell.html" "$BUILD_DIR/index.html"
          else
            echo "No index.html or _shell.html in $BUILD_DIR"
            find "$BUILD_DIR" -maxdepth 3 -name "*.html" | cat
            exit 1
          fi

          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
